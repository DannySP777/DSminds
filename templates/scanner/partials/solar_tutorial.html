<div class="solar-tutorial" id="solar-tutorial">
    <h3 class="solar-tutorial__title">{{ T.tutorial_title }}</h3>
    <div class="solar-tutorial__steps" role="list">
        <button type="button" class="solar-tutorial__step solar-tutorial__step--1 is-active" role="listitem" data-desc="{{ T.tutorial_step1_text }}">
            <span class="solar-tutorial__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <circle cx="12" cy="12" r="2.1" fill="currentColor" stroke="none"/>
                    <ellipse cx="12" cy="12" rx="10" ry="4.2"/>
                    <ellipse cx="12" cy="12" rx="4.2" ry="10"/>
                </svg>
            </span>
            <span class="solar-tutorial__label">1. {{ T.tutorial_step1_label }}</span>
        </button>
        <button type="button" class="solar-tutorial__step solar-tutorial__step--2" role="listitem" data-desc="{{ T.tutorial_step2_text }}">
            <span class="solar-tutorial__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <circle cx="10" cy="10" r="6"/>
                    <line x1="14.6" y1="14.6" x2="20" y2="20"/>
                </svg>
            </span>
            <span class="solar-tutorial__label">2. {{ T.tutorial_step2_label }}</span>
        </button>
        <button type="button" class="solar-tutorial__step solar-tutorial__step--3" role="listitem" data-desc="{{ T.tutorial_step3_text }}">
            <span class="solar-tutorial__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
                    <path d="M5 3.5l13.5 8-6 1.3L10 19z" fill="currentColor" stroke="none"/>
                </svg>
            </span>
            <span class="solar-tutorial__label">3. {{ T.tutorial_step3_label }}</span>
        </button>
        <button type="button" class="solar-tutorial__step solar-tutorial__step--4" role="listitem" data-desc="{{ T.tutorial_step4_text }}">
            <span class="solar-tutorial__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="1.8" fill="currentColor" stroke="none"/>
                    <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="1.8" fill="currentColor" stroke="none"/>
                    <line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="1.8" fill="currentColor" stroke="none"/>
                </svg>
            </span>
            <span class="solar-tutorial__label">4. {{ T.tutorial_step4_label }}</span>
        </button>
    </div>
    <p class="solar-tutorial__desc" id="solar-tutorial-desc">{{ T.tutorial_step1_text }}</p>
</div>
