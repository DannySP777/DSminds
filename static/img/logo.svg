<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="dsmsLogoTitle">
    <title id="dsmsLogoTitle">DSMarketScan</title>
    <defs>
        <radialGradient id="dsms-bg" cx="50%" cy="46%" r="65%">
            <stop offset="0%" stop-color="#1b2028"/>
            <stop offset="100%" stop-color="#0f1115"/>
        </radialGradient>
        <linearGradient id="dsms-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#3ddc97" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="dsms-clip">
            <circle cx="60" cy="60" r="56"/>
        </clipPath>
    </defs>

    <circle cx="60" cy="60" r="58" fill="url(#dsms-bg)" stroke="#262a33" stroke-width="2"/>

    <g clip-path="url(#dsms-clip)">
        <!-- Radar sweep beam -->
        <path d="M60,60 L60,6 A54,54 0 0,1 105.8,33 Z" fill="url(#dsms-sweep)"/>

        <!-- Radar rings -->
        <circle cx="60" cy="60" r="44" fill="none" stroke="#3ddc97" stroke-opacity="0.35" stroke-width="1"/>
        <circle cx="60" cy="60" r="30" fill="none" stroke="#3ddc97" stroke-opacity="0.3" stroke-width="1"/>
        <circle cx="60" cy="60" r="16" fill="none" stroke="#3ddc97" stroke-opacity="0.25" stroke-width="1"/>

        <!-- Radar crosshairs -->
        <line x1="60" y1="4" x2="60" y2="116" stroke="#3ddc97" stroke-opacity="0.15" stroke-width="1"/>
        <line x1="4" y1="60" x2="116" y2="60" stroke="#3ddc97" stroke-opacity="0.15" stroke-width="1"/>

        <!-- Radar blips -->
        <circle cx="86" cy="40" r="1.8" fill="#3ddc97" opacity="0.8"/>
        <circle cx="34" cy="78" r="1.4" fill="#3ddc97" opacity="0.6"/>
    </g>

    <!-- Candlesticks -->
    <g stroke-linecap="round">
        <!-- down candle -->
        <line x1="38" y1="52" x2="38" y2="86" stroke="#e5484d" stroke-width="2"/>
        <rect x="33" y="60" width="10" height="18" rx="1.5" fill="#e5484d"/>

        <!-- up candle (tall, center) -->
        <line x1="60" y1="38" x2="60" y2="92" stroke="#3ddc97" stroke-width="2.4"/>
        <rect x="54" y="50" width="12" height="30" rx="1.5" fill="#3ddc97"/>

        <!-- up candle -->
        <line x1="82" y1="58" x2="82" y2="82" stroke="#3ddc97" stroke-width="2"/>
        <rect x="77" y="64" width="10" height="12" rx="1.5" fill="#3ddc97"/>
    </g>

    <circle cx="60" cy="60" r="58" fill="none" stroke="#3ddc97" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
